services:
  api:
    build:
      context: .
      dockerfile: SmartX.Api/Dockerfile
    image: smartx-api:part2
    ports:
      - "5137:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: SmartX.Client/Dockerfile
    image: smartx-client:part2
    ports:
      - "5170:80"
    depends_on:
      - api
    restart: unless-stopped
