services:
  api:
    build:
      context: .
      dockerfile: SmartX.Api/Dockerfile
    image: smartx-api:part2
    ports:
      - "5137:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "/healthprobe/HealthProbe.dll"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  client:
    build:
      context: .
      dockerfile: SmartX.Client/Dockerfile
    image: smartx-client:part2
    ports:
      - "5170:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
